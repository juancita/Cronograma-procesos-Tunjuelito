; Configuración del seguimiento de cronogramas. Normalmente no hay que cambiar nada.
[cronogramas]
; Código de la entidad en SECOP II y sus nombres (separados por |). Solo se traen sus procesos.
codigo_entidad = 702235227
nombres_entidad = ALCALDIA LOCAL DE TUNJUELITO | BOGOTÁ D.C. - ALCALDÍA LOCAL DE TUNJUELITO
nombre_mostrar = Fondo de Desarrollo Local de Tunjuelito
; Hoja ABIERTOS_SIN_FECHAS: procesos cuyo último hito fue en los últimos N días.
dias_abiertos_sin_fechas = 90
; Índices de documentos de SECOP II para buscar adendas (se buscan solos; estos son el respaldo).
datasets_archivos = dmgg-8hin, h4m3-b4e2
; Opcional: token de aplicación de datos.gov.co (solo si la API empieza a limitar las consultas).
token_app =
; si = abrir el Excel al terminar
abrir_excel = si
